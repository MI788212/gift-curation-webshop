about.title=What is Man Cave?
about.answer.title=We are the answer to the question: What do men actually want?
about.answer.content=Perfume? A belt? Or something completely different, something interesting. Whether it’s a birthday, anniversary, holiday, or you simply want to make someone happy, you’ll find something special with us. We have something for every man, for every personality.
about.answer.button=See for yourself
about.story.title=Our story
about.story.content.1=The idea was born 20 years ago, when I simply couldn’t figure out what to give my boyfriend for his birthday.
about.story.content.2=I wished I could go to one place where all the ideas were already put together, browse through them, and simply choose the best gift for him.
about.story.content.3=I never found such a place. In fact, I haven’t come across one anywhere in all these 20 years since that first thought came to me.
about.story.content.4=So I decided to take matters into my own hands and create exactly what I was looking for back then.
about.story.content.5=The boy from the story is my husband today. The gift was a success, but the idea that followed was even better.
about.meetTheTeam.title=Who Is Behind Man Cave?
about.meetTheTeam.content=Some people like to be in front of the camera. We prefer to be behind a great gift. That’s why we’ll keep our names to ourselves, but we’re leaving our ideas, effort, and love for what we do right here. Behind every product is someone who carefully chose it, designed it, and imagined the moment it would be given.
about.meetTheTeam.scout.title=The Scout
about.meetTheTeam.scout.text=Makes sure all products meet a high standard.
about.meetTheTeam.organizer.title=The Organizer
about.meetTheTeam.organizer.text=Makes sure every idea reaches the right person.
about.meetTheTeam.creative.title=The Creative
about.meetTheTeam.creative.text=Makes sure every idea looks just the way we imagined it.
about.meetTheTeam.economist.title=The Economist
about.meetTheTeam.economist.text=Makes sure Man Cave remains a good idea on paper, too.
