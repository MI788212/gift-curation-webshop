<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{favorites.title}">Favorites</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1 th:text="#{favorites.title}">Favorites</h1>

<div th:if="${favorites.favoritesEmpty}">
    <p th:text="#{favorites.favoritesEmpty}">You have added nothing to favorites.</p>
</div>

<div th:unless="${favorites.favoritesEmpty}">
    <div th:each="entry : ${favorites.products}">
        <a th:href="@{/products/{id}(id=${entry.key})}" th:text="${favorites.products.get(entry.key).name}">Name</a>
<!--najdi nacin da dodades link do product-detail na soodvetniot produkt-->
        — <span th:text="${favorites.products.get(entry.key).price}">0.00</span>

        <form th:action="@{/favorites/remove}" method="post" style="display:inline">
            <input type="hidden" name="productId" th:value="${entry.key}" />
            <button type="submit" th:text="#{favorites.remove}">Remove</button>
        </form>
    </div>

</div>


</body>
</html>
