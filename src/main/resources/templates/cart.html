<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Your Cart</h1>

<div th:if="${cart.cartEmpty}">
    <p>Your cart is empty.</p>
</div>

<div th:unless="${cart.cartEmpty}">
    <div th:each="entry : ${cart.items}">
        <span th:text="${cart.products.get(entry.key).name}">Name</span>
        — qty: <span th:text="${entry.value}">1</span>

        <form th:action="@{/cart/update}" method="post" style="display:inline">
            <input type="hidden" name="productId" th:value="${entry.key}" />
            <input type="number" name="quantity" th:value="${entry.value}" min="0" style="width:50px"
                   onchange="this.form.submit()" />
        </form>

        — <span th:text="${cart.products.get(entry.key).price}">0.00</span>

        <form th:action="@{/cart/remove}" method="post" style="display:inline">
            <input type="hidden" name="productId" th:value="${entry.key}" />
            <button type="submit">Remove</button>
        </form>
    </div>

    <h3>Total: <span th:text="${cart.total}">0.00</span></h3>
    <a th:unless="${cart.cartEmpty}" th:href="@{/checkout}">Proceed to checkout</a>
</div>

<a th:href="@{/products}">Continue shopping</a>

</body>
</html>
