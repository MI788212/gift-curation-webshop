<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{products.title}">Products</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/products.css}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div id="body">

    <h1 th:text="#{products.title}">Products</h1>

    <nav class="categoryFilter" th:aria-label="#{products.filter.label}">
        <a th:href="@{/products}" th:text="#{products.filter.all}"
           th:classappend="${selectedCategory == null} ? 'isActive'"
           th:aria-current="${selectedCategory == null} ? 'true'">All</a>
        <a th:each="c : ${categories}" th:href="@{/products(category=${c.slug()})}"
           th:text="${#messages.msg('category.' + c.slug())}"
           th:classappend="${c == selectedCategory} ? 'isActive'"
           th:aria-current="${c == selectedCategory} ? 'true'">Gadgets</a>
    </nav>

    <p class="productsEmpty" th:if="${#lists.isEmpty(products)}" th:text="#{products.empty}">
        There are no products in this category yet.
    </p>

    <div id="products-container">

        <div th:each="p : ${products}">
            <a th:href="@{/products/{id}(id=${p.id})}">
                <img th:src="${p.imageUrl}" src="https://via.placeholder.com/200" alt="Product image" th:alt="${p.name}">
                <h3 th:text="${p.name}">Placeholder</h3>
            </a>
            <div class="price-div">
                <p th:text="${#numbers.formatDecimal(p.price, 0, 0)}">0</p>
                <p>&nbsp;ден.</p>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
