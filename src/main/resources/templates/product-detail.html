<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/product-detailsStyle.css?v=2}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<nav class="navbar">
    <div class="nav-logo">
        <a href="#">MyShop</a>
    </div>
    <ul class="nav-links">
        <li><a href="#">Почетна</a></li>
        <li><a href="#">Производи</a></li>
        <li><a href="#">За нас</a></li>
        <li><a href="#">Контакт</a></li>
    </ul>
</nav>

<div id="body">
    <div id="product-profile">
        <img th:src="${product.imageUrl}" src="https://via.placeholder.com/200" alt="Product image">
    </div>


    <div id="products-functions">

            <h1 th:text="${product.name}">Product name</h1>
            <p class="discription" th:text="${#numbers.formatDecimal(product.price, 0, 0)} + ' ден.'">0</p>
            <p th:text="${product.description}">Тука оди описот на продуктот...</p>

            <button type="button" class="btn btn-fav"
                    th:onclick="'addFavorite(' + ${product.id} + ')'">
            </button>

            <script>
                function addFavorite(id) {
                    fetch('/favorites/add?productId=' + id, { method: 'POST' });
                }
            </script>

            <form th:action="@{/cart/add}" method="post" class="cart-form">
                <input type="hidden" name="productId" th:value="${product.id}" />
                <label><span th:text="#{product-detail.quantity}">Quantity</span>:
                    <input type="number" name="quantity" value="1" min="1" class="qty-input" />
                </label>
                <button type="submit" class="btn btn-cart" th:text="#{product-detail.addToCart}">Add to cart</button>
            </form>

            <a th:href="@{/products}" class="back-link" th:text="#{product-detail.back}">Back to all products</a>
    </div>

</div>

<div style="background-color: red" >

</div>

</body>
</html>
