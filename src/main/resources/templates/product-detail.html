<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1 th:text="${product.name}">Product name</h1>
<p th:text="${product.price}">0.00</p>

<form th:action="@{/cart/add}" method="post">
    <input type="hidden" name="productId" th:value="${product.id}" />
    <label><span th:text="#{product-detail.quantity}">Quantity</span>:
        <input type="number" name="quantity" value="1" min="1" />
    </label>
    <button type="submit" th:text="#{product-detail.addToCart}">Add to cart</button>
</form>

<a th:href="@{/products}" th:text="#{product-detail.back}">Back to all products</a>

</body>
</html>
