<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="siteHeader" th:fragment="navbar">
    <nav class="siteNav" th:aria-label="#{navbar.label}">
        <a class="siteBrand" th:href="@{/}">Man Cave</a>

        <ul class="siteNavLinks" id="siteNavLinks">
            <li><a th:href="@{/}" th:text="#{navbar.home}">Home</a></li>
            <li><a th:href="@{/products}" th:text="#{navbar.products}">Products</a></li>
            <li><a th:href="@{/about}" th:text="#{navbar.about}">About</a></li>
            <li><a th:href="@{/news}" th:text="#{navbar.news}">News</a></li>
            <li><a th:href="@{/contact}" th:text="#{navbar.contact}">Contact</a></li>
            <li>
                <a class="siteNavIcon" th:href="@{/favorites}" th:title="#{navbar.favorites}">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span class="siteNavLabel" th:text="#{navbar.favorites}">Favorites</span>
                </a>
            </li>
            <li>
                <a class="siteNavIcon" th:href="@{/cart}" th:title="#{navbar.cart}">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                    <span class="siteNavLabel" th:text="#{navbar.cart}">Cart</span>
                </a>
            </li>
        </ul>

        <div class="langSwitcher" role="group" th:aria-label="#{navbar.language}">
            <a th:href="@{''(lang=en)}" lang="en"
               th:classappend="${#locale.language == 'en'} ? 'isActive'"
               th:aria-current="${#locale.language == 'en'} ? 'true'">EN</a>
            <a th:href="@{''(lang=mk)}" lang="mk"
               th:classappend="${#locale.language == 'mk'} ? 'isActive'"
               th:aria-current="${#locale.language == 'mk'} ? 'true'">MK</a>
        </div>

        <button class="siteNavToggle" type="button" aria-controls="siteNavLinks" aria-expanded="false"
                th:aria-label="#{navbar.menu}">
            <span></span><span></span><span></span>
        </button>
    </nav>
</header>

</body>
</html>
