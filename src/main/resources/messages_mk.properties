about.title=Што е Man Cave?
about.answer.title=Ние сме одговор на прашањето: Што воопшто посакуваат мажите?
about.answer.content=Парфем? Каиш? Или нешто сосема друго, нешто интересно. Без разлика дали е роденден, годишнина, празник или едноставно сакате да израдувате некого, кај нас ќе најдете нешто посебно. Имаме по нешто за секој маж, за секој карактер.
about.answer.button=Погледнете сами
about.story.title=Нашата приказна
about.story.content.1=Идејата се роди пред 20 години, кога никако не можев да смислам што да му подарам на моето момче за роденден.
about.story.content.2=Посакував да можам да појдам на едно место каде што веќе се разработени сите идеи, да разгледам и едноставно да го изберам најдобриот подарок за него.
about.story.content.3=Такво место не најдов. Всушност, не го сретнав никаде во сите овие 20 години што поминаа од мојата прва помисла.
about.story.content.4=Па решив да ја преземам работата во свои раце и да го создадам токму тоа што тогаш го барав.
about.story.content.5=Момчето од приказната денес ми е сопруг. Подарокот беше успешен, но идејата што следеше беше уште подобра.
about.meetTheTeam.title=Кој стои зад Man Cave?
about.meetTheTeam.content=Некои луѓе сакаат да бидат пред камера. Ние повеќе сакаме да бидеме зад добриот подарок. Затоа, имињата ќе ги задржиме за себе, но идеите, трудот и љубовта кон тоа што го правиме ги оставаме тука. Зад секој производ стои некој кој внимателно го избрал, осмислил и замислил моментот кога ќе биде подарен.
about.meetTheTeam.scout.title=Трагачот
about.meetTheTeam.scout.text=Се грижи сите продукти да се на висок стандард.
about.meetTheTeam.organizer.title=Организаторот
about.meetTheTeam.organizer.text=Се грижи секоја идеја да стигне до вистинскиот човек.
about.meetTheTeam.creative.title=Креативецот
about.meetTheTeam.creative.text=Се грижи секоја идеја да изгледа онака како што ја замисливме.
about.meetTheTeam.economist.title=Економистот
about.meetTheTeam.economist.text=Се грижи Man Cave да остане добра идеја и на хартија.
