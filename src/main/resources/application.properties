spring.application.name=demo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.messages.encoding=UTF-8

spring.thymeleaf.cache=false

# Исклучи го кешот за сите статички ресурси
spring.web.resources.cache.period=0

# Овозможи автоматско следење на промени во шаблоните
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Formspree form the contact page sends messages to (https://formspree.io/f/...).
# The CONTACT_FORM_ENDPOINT environment variable overrides it, e.g. in the RepoRun UI.
contact.form.endpoint=